<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Sobreviviendo a la carrera de matemáticas</title><style id="css">
:root{color-scheme:dark;--bg:#0b0f1a;--surface:#121a2b;--text:#e6ebf5;--muted:#8d9ab3;--accent:#5b9cff;--line:#1f2b45;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:18px/1.7 Georgia,"Times New Roman",serif}
.wrap{max-width:680px;margin:0 auto;padding:0 20px 60px}
header{padding:56px 0 24px;border-bottom:1px solid var(--line)}
h1{font-size:2.1rem;line-height:1.2;margin:0 0 8px}
.sub{color:var(--muted);margin:0;font-style:italic}
.sym{color:var(--accent);font-size:1.4rem;letter-spacing:.3em;margin-bottom:12px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}
nav button{font:inherit;font-size:.9rem;padding:6px 14px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#0b0f1a}
article{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:20px}
article h2{margin:0 0 4px;font-size:1.4rem}
.meta{color:var(--muted);font-size:.85rem;margin:0 0 14px}
.tag{color:var(--accent);font-weight:bold;cursor:pointer}.tag:hover,.tag:focus-visible{text-decoration:underline}
article p{margin:0 0 12px;white-space:pre-line}
.math{overflow-x:auto;background:var(--bg);border-left:3px solid var(--accent);padding:10px 16px;font-family:"Courier New",monospace;font-size:.95rem;white-space:pre;margin:0 0 12px}
footer{color:var(--muted);font-size:.85rem;text-align:center;padding-top:20px}
#admin{margin:0 0 24px}
.add{font:inherit;font-size:.9rem;padding:8px 16px;border:0;border-radius:8px;background:var(--accent);color:#0b0f1a;cursor:pointer}
.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
#addForm{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:12px}
#addForm[hidden]{display:none}
#addForm label{display:block;margin-bottom:12px;font-size:.9rem;color:var(--muted)}
#addForm input,#addForm select,#addForm textarea{display:block;width:100%;margin-top:4px;font:inherit;font-size:1rem;padding:8px 10px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px}
.hint{color:var(--muted);font-size:.85rem;margin:0 0 12px}
.row{display:flex;gap:8px}
article{position:relative}
article h2{padding-right:76px}
.tools{position:absolute;top:14px;right:14px;display:flex;gap:6px;opacity:0;transition:opacity .15s}
article:hover .tools,article:focus-within .tools{opacity:1}
@media (hover:none){.tools{opacity:1}}
.tools button{display:flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--muted);cursor:pointer}
.tools button:hover,.tools button:focus-visible{color:var(--accent);border-color:var(--accent)}
.tools .del:hover,.tools .del:focus-visible{color:#ff6b6b;border-color:#ff6b6b}
.confirm{background:var(--bg);border:1px solid #ff6b6b;border-radius:8px;padding:12px 14px;margin-top:12px}
.confirm p{margin:0 0 10px}
.danger{background:#ff6b6b}
.editbox label{display:block;margin-bottom:12px;font-size:.9rem;color:var(--muted)}
.editbox input,.editbox select,.editbox textarea{display:block;width:100%;margin-top:4px;font:inherit;font-size:1rem;padding:8px 10px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px}
</style></head><body><div class="wrap" id="wrap">
<header>
<div class="sym">∑ ∫ π</div>
<h1>Sobreviviendo a la carrera de matemáticas</h1>
<p class="sub">Reflexiones y curiosidades de mi vida en la carrera de Matemáticas.</p>
</header>
<nav aria-label="Filtrar entradas">
<button data-f="all" aria-pressed="true">Todas</button>
<button data-f="Reflexión" aria-pressed="false">Reflexiones</button>
<button data-f="Curiosidad" aria-pressed="false">Curiosidades</button>
</nav>
<div id="admin"></div>
<main id="entries"></main>
<footer>© 2026 · Escrito desde el infierno de la US</footer>
</div><script type="application/json" id="posts">[{"title":"Hola, mundo (y hola, primer año)","cat":"Reflexión","date":"Octubre de 2026","body":"Soy estudiante de primer año del grado en Matemáticas, y este es el cuaderno donde voy a apuntar cómo me va: lo que me cuesta, lo que me fascina y lo que aprendo por el camino.\n\nEscribir sobre la carrera me ayuda a pensarla. Si además a alguien le sirve para decidirse a estudiarla, mejor todavía"},{"title":"¿Por qué 0,999… es exactamente 1?","cat":"Curiosidad","date":"Octubre de 2026","body":"Una de esas cosas que parecen trampa. Una forma rápida de verlo:\n\n```\nx = 0,999…\n10x = 9,999…\n10x − x = 9\n9x = 9  →  x = 1\n```\n\nNo es que se “acerque” a 1: son dos escrituras distintas del mismo número."}]</script><script id="app">
var posts=[],owner=false,art=null;
try{posts=JSON.parse(document.getElementById("posts").textContent)}catch(e){}

function render(){
  var m=document.getElementById("entries");m.innerHTML="";
  posts.forEach(function(p,i){
    var a=document.createElement("article");a.dataset.cat=p.cat;a.dataset.i=i;
    var h=document.createElement("h2");h.textContent=p.title;
    var meta=document.createElement("p");meta.className="meta";
    var t=document.createElement("span");t.className="tag";t.textContent=p.cat;
    t.setAttribute("role","button");t.setAttribute("tabindex","0");
    meta.appendChild(t);meta.appendChild(document.createTextNode(" · "+p.date));
    a.appendChild(h);a.appendChild(meta);
    p.body.split(/\n\s*\n/).forEach(function(para){
      para=para.trim();if(!para)return;
      var e;
      if(para.indexOf("```")===0){e=document.createElement("div");e.className="math";e.textContent=para.replace(/^```\n?|\n?```$/g,"");}
      else{e=document.createElement("p");e.textContent=para;}
      a.appendChild(e);
    });
    if(owner)a.appendChild(tools(i));
    m.appendChild(a);
  });
  var pb=document.querySelector('nav button[aria-pressed="true"]');
  if(pb&&pb.dataset.f!=="all")pb.click();
}
render();

document.querySelectorAll("nav button").forEach(function(b){
  b.addEventListener("click",function(){
    document.querySelectorAll("nav button").forEach(function(x){x.setAttribute("aria-pressed","false")});
    b.setAttribute("aria-pressed","true");
    var f=b.dataset.f;
    document.querySelectorAll("article").forEach(function(a){
      a.style.display=(f==="all"||a.dataset.cat===f)?"":"none";
    });
  });
});
document.addEventListener("click",function(e){
  var t=e.target.closest(".tag");
  if(!t)return;
  var btn=document.querySelector('nav button[data-f="'+t.textContent.trim()+'"]');
  if(btn){btn.click();document.querySelector("nav").scrollIntoView({behavior:"smooth"});}
});
document.addEventListener("keydown",function(e){
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("tag")){e.preventDefault();e.target.click();}
});

var ICON_EDIT='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
var ICON_DEL='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>';

function tools(i){
  var d=document.createElement("div");d.className="tools";
  var e=document.createElement("button");e.innerHTML=ICON_EDIT;e.title="Editar entrada";e.setAttribute("aria-label","Editar entrada");
  var x=document.createElement("button");x.className="del";x.innerHTML=ICON_DEL;x.title="Eliminar entrada";x.setAttribute("aria-label","Eliminar entrada");
  e.onclick=function(){startEdit(i)};
  x.onclick=function(){askDelete(i)};
  d.appendChild(e);d.appendChild(x);return d;
}
function articleOf(i){return document.querySelector('article[data-i="'+i+'"]')}
function save(list,msg){
  msg.textContent="Publicando…";
  return art.publish(buildDoc(list)).catch(function(e){msg.textContent="No se ha podido publicar ("+(e&&e.code?e.code:"error")+").";});
}
function askDelete(i){
  var a=articleOf(i);if(!a||a.querySelector(".confirm"))return;
  var c=document.createElement("div");c.className="confirm";
  c.innerHTML='<p>¿Seguro que quieres eliminar esta entrada? No se puede deshacer.</p><div class="row"><button class="add danger">Sí, eliminar</button><button class="add ghost">Cancelar</button></div><p class="hint"></p>';
  var b=c.querySelectorAll("button"),msg=c.querySelector(".hint");
  b[0].onclick=function(){save(posts.filter(function(_,k){return k!==i}),msg)};
  b[1].onclick=function(){c.remove()};
  a.appendChild(c);
}
function startEdit(i){
  var a=articleOf(i),p=posts[i];if(!a||a.querySelector(".editbox"))return;
  Array.prototype.forEach.call(a.children,function(c){c.style.display="none"});
  var f=document.createElement("div");f.className="editbox";
  f.innerHTML='<label>Título<input maxlength="120"></label><label>Categoría<select><option>Reflexión</option><option>Curiosidad</option></select></label><label>Texto<textarea rows="8"></textarea></label><p class="hint">Separa los párrafos con una línea en blanco.</p><div class="row"><button class="add">Guardar</button><button class="add ghost">Cancelar</button></div><p class="hint"></p>';
  var inp=f.querySelector("input"),sel=f.querySelector("select"),ta=f.querySelector("textarea"),b=f.querySelectorAll("button"),msg=f.querySelectorAll(".hint")[1];
  inp.value=p.title;sel.value=p.cat;ta.value=p.body;
  b[0].onclick=function(){
    var t=inp.value.trim(),x=ta.value.trim();
    if(!t||!x){msg.textContent="Escribe un título y un texto.";return;}
    var next=posts.slice();next[i]={title:t,cat:sel.value,date:p.date,body:x};
    save(next,msg);
  };
  b[1].onclick=function(){render()};
  a.appendChild(f);
}

function buildDoc(list){
  var w=document.getElementById("wrap").cloneNode(true);
  w.querySelector("#entries").innerHTML="";
  w.querySelector("#admin").innerHTML="";
  w.querySelectorAll("nav button").forEach(function(b,i){b.setAttribute("aria-pressed",i===0?"true":"false")});
  return "<!DOCTYPE html>\n<html lang=\"es\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"><title>"+document.title+"</title><style id=\"css\">"+document.getElementById("css").textContent+"</style></head><body>"+w.outerHTML+"<script type=\"application/json\" id=\"posts\">"+JSON.stringify(list).replace(/</g,"\\u003c")+"</"+"script><script id=\"app\">"+document.getElementById("app").textContent+"</"+"script></body></html>";
}

function setupAdmin(art){
  var box=document.getElementById("admin");
  box.innerHTML='<button class="add" id="addBtn">✎ Añadir entrada</button>'+
  '<div id="addForm" hidden>'+
  '<label>Título<input id="fTitle" maxlength="120"></label>'+
  '<label>Categoría<select id="fCat"><option>Reflexión</option><option>Curiosidad</option></select></label>'+
  '<label>Texto<textarea id="fBody" rows="8"></textarea></label>'+
  '<p class="hint">Separa los párrafos con una línea en blanco.</p>'+
  '<div class="row"><button class="add" id="fSave">Publicar</button><button class="add ghost" id="fCancel">Cancelar</button></div>'+
  '<p class="hint" id="fMsg"></p></div>';
  var form=document.getElementById("addForm"),msg=document.getElementById("fMsg");
  document.getElementById("addBtn").onclick=function(){form.hidden=!form.hidden;};
  document.getElementById("fCancel").onclick=function(){form.hidden=true;msg.textContent="";};
  document.getElementById("fSave").onclick=async function(){
    var t=document.getElementById("fTitle").value.trim(),b=document.getElementById("fBody").value.trim();
    if(!t||!b){msg.textContent="Escribe un título y un texto.";return;}
    var d=new Date().toLocaleDateString("es-ES",{month:"long",year:"numeric"});
    d=d.charAt(0).toUpperCase()+d.slice(1);
    var next=[{title:t,cat:document.getElementById("fCat").value,date:d,body:b}].concat(posts);
    msg.textContent="Publicando…";
    try{await art.publish(buildDoc(next));}
    catch(e){msg.textContent="No se ha podido publicar ("+(e&&e.code?e.code:"error")+").";}
  };
}

(async function(){
  try{
    if(!window.claude)return;
    var user=await claude.use("user");
    if(!user||!user.isOwner())return;
    art=await claude.use("artifact");
    if(art){owner=true;setupAdmin(art);render();}
  }catch(e){}
})();
</script></body></html>
