<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sobreviviendo a la carrera de matemáticas</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f1a;
      --surface: #121a2b;
      --text: #e6ebf5;
      --muted: #8d9ab3;
      --accent: #5b9cff;
      --line: #1f2b45;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 18px/1.7 Georgia, "Times New Roman", serif;
    }
    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }
    header {
      padding: 56px 0 24px;
      border-bottom: 1px solid var(--line);
    }
    h1 { font-size: 2.1rem; line-height: 1.2; margin: 0 0 8px; }
    .sub { color: var(--muted); margin: 0; font-style: italic; }
    .sym { color: var(--accent); font-size: 1.4rem; letter-spacing: .3em; margin-bottom: 12px; }
    nav { display: flex; gap: 8px; flex-wrap: wrap; margin: 24px 0; }
    nav button {
      font: inherit;
      font-size: .9rem;
      padding: 6px 14px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      border-radius: 999px;
      cursor: pointer;
    }
    nav button[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #0b0f1a;
    }
    article {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }
    article h2 { margin: 0 0 4px; font-size: 1.4rem; }
    .meta { color: var(--muted); font-size: .85rem; margin: 0 0 14px; }
    .tag { color: var(--accent); font-weight: bold; cursor: pointer; }
    .tag:hover { text-decoration: underline; }
    article p { margin: 0 0 12px; white-space: pre-line; }
    .math {
      overflow-x: auto;
      background: var(--bg);
      border-left: 3px solid var(--accent);
      padding: 10px 16px;
      font-family: "Courier New", monospace;
      font-size: .95rem;
      white-space: pre;
      margin: 0 0 12px;
    }
    footer { color: var(--muted); font-size: .85rem; text-align: center; padding-top: 20px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="sym">∑ ∫ π</div>
      <h1>Sobreviviendo a la carrera de matemáticas</h1>
      <p class="sub">Reflexiones y curiosidades de mi vida en la carrera de Matemáticas.</p>
    </header>

    <nav aria-label="Filtrar entradas">
      <button data-f="all" aria-pressed="true">Todas</button>
      <button data-f="Reflexión" aria-pressed="false">Reflexiones</button>
      <button data-f="Curiosidad" aria-pressed="false">Curiosidades</button>
    </nav>

    <main id="entries"></main>

    <footer>© 2026 · Escrito desde el infierno de la US</footer>
  </div>

  <script>
    var posts = [
      {
        "title": "Hola, mundo (y hola, primer año)",
        "cat": "Reflexión",
        "date": "Octubre de 2026",
        "body": "Soy estudiante de primer año del grado en Matemáticas, y este es el cuaderno donde voy a apuntar cómo me va: lo que me cuesta, lo que me fascinante y lo que aprendo por el camino.\n\nEscribir sobre la carrera me ayuda a pensarla. Si además a alguien le sirve para decidirse a estudiarla, mejor todavía."
      },
      {
        "title": "¿Por qué 0,999… es exactamente 1?",
        "cat": "Curiosidad",
        "date": "Octubre de 2026",
        "body": "Una de esas cosas que parecen trampa. Una forma rápida de verlo:\n\n```\nx = 0,999…\n10x = 9,999…\n10x − x = 9\n9x = 9  →  x = 1\n```\n\nNo es que se “acerque” a 1: son dos escrituras distintas del mismo número."
      }
    ];

    function render() {
      var m = document.getElementById("entries");
      m.innerHTML = "";
      posts.forEach(function(p) {
        var a = document.createElement("article");
        a.dataset.cat = p.cat;
        
        var h = document.createElement("h2");
        h.textContent = p.title;
        
        var meta = document.createElement("p");
        meta.className = "meta";
        var t = document.createElement("span");
        t.className = "tag";
        t.textContent = p.cat;
        meta.appendChild(t);
        meta.appendChild(document.createTextNode(" · " + p.date));
        
        a.appendChild(h);
        a.appendChild(meta);
        
        p.body.split(/\n\s*\n/).forEach(function(para) {
          para = para.trim();
          if (!para) return;
          var e;
          if (para.indexOf("```") === 0) {
            e = document.createElement("div");
            e.className = "math";
            e.textContent = para.replace(/^```\n?|\n?```$/g, "");
          } else {
            e = document.createElement("p");
            e.textContent = para;
          }
          a.appendChild(e);
        });
        
        m.appendChild(a);
      });
    }

    render();

    document.querySelectorAll("nav button").forEach(function(b) {
      b.addEventListener("click", function() {
        document.querySelectorAll("nav button").forEach(function(x) {
          x.setAttribute("aria-pressed", "false");
        });
        b.setAttribute("aria-pressed", "true");
        var f = b.dataset.f;
        document.querySelectorAll("article").forEach(function(a) {
          a.style.display = (f === "all" || a.dataset.cat === f) ? "" : "none";
        });
      });
    });

    document.addEventListener("click", function(e) {
      var t = e.target.closest(".tag");
      if (!t) return;
      var btn = document.querySelector('nav button[data-f="' + t.textContent.trim() + '"]');
      if (btn) btn.click();
    });
  </script>
</body>
</html>
