<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sobreviviendo a la carrera de matemáticas</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f1a;
      --surface: #121a2b;
      --text: #e6ebf5;
      --muted: #8d9ab3;
      --accent: #5b9cff;
      --line: #1f2b45;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 18px/1.7 Georgia, "Times New Roman", serif;
    }
    .wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }
    header {
      padding: 56px 0 24px;
      border-bottom: 1px solid var(--line);
    }
    h1 { font-size: 2.1rem; line-height: 1.2; margin: 0 0 8px; }
    .sub { color: var(--muted); margin: 0; font-style: italic; }
    .sym { color: var(--accent); font-size: 1.4rem; letter-spacing: .3em; margin-bottom: 12px; }
    nav { display: flex; gap: 8px; flex-wrap: wrap; margin: 24px 0; }
    nav button {
      font: inherit;
      font-size: .9rem;
      padding: 6px 14px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      border-radius: 999px;
      cursor: pointer;
    }
    nav button[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #0b0f1a;
    }
    article {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }
    article h2 { margin: 0 0 4px; font-size: 1.4rem; padding-right: 76px; }
    .meta { color: var(--muted); font-size: .85rem; margin: 0 0 14px; }
    .tag { color: var(--accent); font-weight: bold; cursor: pointer; }
    .tag:hover { text-decoration: underline; }
    article p { margin: 0 0 12px; white-space: pre-line; }
    .math {
      overflow-x: auto;
      background: var(--bg);
      border-left: 3px solid var(--accent);
      padding: 10px 16px;
      font-family: "Courier New", monospace;
      font-size: .95rem;
      white-space: pre;
      margin: 0 0 12px;
    }
    footer { color: var(--muted); font-size: .85rem; text-align: center; padding-top: 20px; }

    /* Admin Styles */
    #admin { margin: 0 0 24px; }
    .add {
      font: inherit;
      font-size: .9rem;
      padding: 8px 16px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #0b0f1a;
      cursor: pointer;
      font-weight: bold;
    }
    .ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
    #addForm {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
      margin-top: 12px;
    }
    #addForm label, .editbox label { display: block; margin-bottom: 12px; font-size: .9rem; color: var(--muted); }
    #addForm input, #addForm select, #addForm textarea,
    .editbox input, .editbox select, .editbox textarea {
      display: block;
      width: 100%;
      margin-top: 4px;
      font: inherit;
      font-size: 1rem;
      padding: 8px 10px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .hint { color: var(--muted); font-size: .85rem; margin: 8px 0; }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    .tools {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      gap: 6px;
      opacity: 0;
      transition: opacity .15s;
    }
    article:hover .tools, article:focus-within .tools { opacity: 1; }
    @media (hover: none) { .tools { opacity: 1; } }
    .tools button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      color: var(--muted);
      cursor: pointer;
    }
    .tools button:hover { color: var(--accent); border-color: var(--accent); }
    .tools .del:hover { color: #ff6b6b; border-color: #ff6b6b; }
    .confirm { background: var(--bg); border: 1px solid #ff6b6b; border-radius: 8px; padding: 12px 14px; margin-top: 12px; }
    .confirm p { margin: 0 0 10px; }
    .danger { background: #ff6b6b; color: #fff; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="sym">∑ ∫ π</div>
      <h1>Sobreviviendo a la carrera de matemáticas</h1>
      <p class="sub">Reflexiones y curiosidades de mi vida en la carrera de Matemáticas.</p>
    </header>

    <nav aria-label="Filtrar entradas">
      <button data-f="all" aria-pressed="true">Todas</button>
      <button data-f="Reflexión" aria-pressed="false">Reflexiones</button>
      <button data-f="Curiosidad" aria-pressed="false">Curiosidades</button>
    </nav>

    <div id="admin">
      <button class="add" id="addBtn">✎ Añadir entrada</button>
      <div id="addForm" hidden>
        <label>Título<input id="fTitle" maxlength="120"></label>
        <label>Categoría
          <select id="fCat">
            <option>Reflexión</option>
            <option>Curiosidad</option>
          </select>
        </label>
        <label>Texto<textarea id="fBody" rows="8"></textarea></label>
        <p class="hint">Separa los párrafos con una línea en blanco.</p>
        <div class="row">
          <button class="add" id="fSave">Publicar</button>
          <button class="add ghost" id="fCancel">Cancelar</button>
        </div>
      </div>
    </div>

    <main id="entries"></main>

    <footer>© 2026 · Escrito desde el infierno de la US</footer>
  </div>

  <script>
    var defaultPosts = [
      {
        "title": "Hola, mundo (y hola, primer año)",
        "cat": "Reflexión",
        "date": "Octubre de 2026",
        "body": "Soy estudiante de primer año del grado en Matemáticas, y este es el cuaderno donde voy a apuntar cómo me va: lo que me cuesta, lo que me fascina y lo que aprendo por el camino.\n\nEscribir sobre la carrera me ayuda a pensarla. Si además a alguien le sirve para decidirse a estudiarla, mejor todavía."
      },
      {
        "title": "¿Por qué 0,999… es exactamente 1?",
        "cat": "Curiosidad",
        "date": "Octubre de 2026",
        "body": "Una de esas cosas que parecen trampa. Una forma rápida de verlo:\n\n```\nx = 0,999…\n10x = 9,999…\n10x − x = 9\n9x = 9  →  x = 1\n```\n\nNo es que se “acerque” a 1: son dos escrituras distintas del mismo número."
      }
    ];

    var posts = [];
    try {
      var saved = localStorage.getItem("math_blog_posts");
      posts = saved ? JSON.parse(saved) : defaultPosts;
    } catch(e) {
      posts = defaultPosts;
    }

    function saveState() {
      try {
        localStorage.setItem("math_blog_posts", JSON.stringify(posts));
      } catch(e){}
      render();
    }

    var ICON_DEL = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>';

    function tools(i) {
      var d = document.createElement("div"); d.className = "tools";
      var e = document.createElement("button"); e.innerHTML = ICON_EDIT; e.title = "Editar entrada";
      var x = document.createElement("button"); x.className = "del"; x.innerHTML = ICON_DEL; x.title = "Eliminar entrada";
      e.onclick = function() { startEdit(i); };
      x.onclick = function() { askDelete(i); };
      d.appendChild(e); d.appendChild(x);
      return d;
    }

    function render() {
      var m = document.getElementById("entries");
      m.innerHTML = "";
      posts.forEach(function(p, i) {
        var a = document.createElement("article");
        a.dataset.cat = p.cat;
        a.dataset.i = i;
        
        var h = document.createElement("h2"); h.textContent = p.title;
        var meta = document.createElement("p"); meta.className = "meta";
        var t = document.createElement("span"); t.className = "tag"; t.textContent = p.cat;
        meta.appendChild(t); meta.appendChild(document.createTextNode(" · " + p.date));
        
        a.appendChild(h);
        a.appendChild(meta);
        
        p.body.split(/\n\s*\n/).forEach(function(para) {
          para = para.trim();
          if (!para) return;
          var e;
